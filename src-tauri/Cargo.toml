[package]
name = "glassdock"
version = "0.1.0"
description = "A liquid glass smart dock for Windows"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which Cargo needs on Windows (rust-lang/cargo#8519).
name = "glassdock_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
notify = "8"
parking_lot = "0.12"
png = "0.18"
windows-core = "0.62"
windows-future = "0.3"
wmi = "0.18"
keyring = "4"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "http2", "charset", "system-proxy"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }

# Same major/minor as the copy Tauri, tao and wry use, so HWND and friends are one type.
[dependencies.windows]
version = "0.62"
features = [
  "Devices_Power",
  "Devices_Radios",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

# Panics unwind (no `panic = "abort"`): callbacks from Windows are wrapped in
# catch_unwind, and a panicking worker must not take the dock down.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
