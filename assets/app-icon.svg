<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3a67"/>
      <stop offset="0.55" stop-color="#1a2140"/>
      <stop offset="1" stop-color="#0d1022"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd4ff"/>
      <stop offset="1" stop-color="#b08cff"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>

  <!-- Soft colour behind the glass, standing in for a wallpaper -->
  <circle cx="352" cy="430" r="230" fill="url(#glow)" opacity="0.55"/>
  <circle cx="700" cy="330" r="150" fill="#ff9ec7" opacity="0.35"/>

  <!-- Dock pill -->
  <rect x="176" y="560" width="672" height="184" rx="92" fill="url(#pill)"/>
  <rect x="179" y="563" width="666" height="178" rx="89" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- Widgets in the dock -->
  <rect x="236" y="606" width="92" height="92" rx="26" fill="#ffffff" opacity="0.92"/>
  <rect x="356" y="606" width="92" height="92" rx="26" fill="#ffffff" opacity="0.72"/>
  <rect x="476" y="606" width="92" height="92" rx="26" fill="#ffffff" opacity="0.52"/>
  <circle cx="742" cy="652" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="14"/>
  <path d="M742 610 A42 42 0 1 1 705.6 673" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
</svg>
